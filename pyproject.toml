[project]
name = "coin-trading"
version = "1.0.0"
description = "Upbit KRW-BTC QQE automated trading"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "requests>=2.32",
    "pyarrow>=16",
]

[tool.uv]
package = false

[dependency-groups]
lint = [
    "basedpyright>=1.39",
    "pandas-stubs>=2.2",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",
    "B",
    "I", "UP", "SIM", "RUF",
    "DTZ",
    "S",
    "PD", "NPY",
    "LOG", "G",
    "C901", "PLR0912", "PLR0915", "PLR0913",
]
ignore = [
    # Formula symbols are intentional.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Assertions and fake credentials are intentional in tests.
"test_*.py" = ["S101", "S106"]

[tool.ruff.format]
quote-style = "double"

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
